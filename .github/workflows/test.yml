name: template-tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip jinja2
      - run: python scripts/minify_jinja.py chat_template.jinja chat_template_oneline.txt
      - run: python scripts/test_omp_extensions.py
      - run: python scripts/test_v22.py
      - run: python scripts/fuzz_template.py --cases 500 --seed 0
      - run: QWEN_TEMPLATE_FILE=chat_template_oneline.txt python scripts/test_omp_extensions.py
      - run: QWEN_TEMPLATE_FILE=chat_template_oneline.txt python scripts/test_v22.py
